[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm2jev"
version = "0.1.0"
description = "Adapt language models to Jev-style structured questions."
requires-python = ">=3.10"

[project.scripts]
llm2jev-serve = "llm2jev.sglang_server:main"

[project.optional-dependencies]
transformers = [
    "torch>=2.0",
    "transformers>=4.51",
]
sglang = [
    "sglang==0.5.14; sys_platform == 'linux'",
    # SGLang requires this prerelease; declaring it opts uv into resolving it.
    "flash-attn-4==4.0.0b15; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["src"]
