[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm2jev"
version = "0.1.0"
description = "Adapt language models to Jev-style structured questions."
requires-python = ">=3.10"

[project.optional-dependencies]
transformers = [
    "torch>=2.0",
    "transformers>=4.51",
]

[tool.setuptools.packages.find]
where = ["src"]
